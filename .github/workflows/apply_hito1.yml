name: Apply Hito 1
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch security and upload handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('server.ts')
          s = p.read_text()
          if 'import multer from "multer";' not in s:
              s = s.replace('import express, { Request, Response } from "express";\n', 'import express, { Request, Response } from "express";\nimport multer from "multer";\n')
          marker = 'const FOOD_ADMIN_ROLES:'
          upload_cfg = '''const uploadProductImage = multer({\n  storage: multer.memoryStorage(),\n  limits: { fileSize: 5 * 1024 * 1024, files: 1 },\n  fileFilter: (_req, file, cb) => {\n    const allowed = new Set(['image/jpeg', 'image/png', 'image/webp']);\n    cb(null, allowed.has(file.mimetype));\n  },\n});\n\n'''
          if 'const uploadProductImage = multer({' not in s:
              s = s.replace(marker, upload_cfg + marker, 1)

          replacements = {
              'id: `ev_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`': 'id: `ev_${crypto.randomUUID()}`',
              'const companyId = `comp_${Date.now()}`;': 'const companyId = `comp_${crypto.randomUUID()}`;',
              'id: `usr_${Date.now()}`': 'id: `usr_${crypto.randomUUID()}`',
              'id: `inv_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`': 'id: `inv_${crypto.randomUUID()}`',
              'id: id || `fprod_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`': 'id: id || `fprod_${crypto.randomUUID()}`',
          }
          for a,b in replacements.items():
              s = s.replace(a,b)

          upload = r'''  // UPLOAD PRODUCT IMAGE (MULTI-TENANT SECURE FILE UPLOAD)
  app.post("/api/food/products/upload-image", authenticateUser, (req: AuthenticatedRequest, res: Response) => {
    if (!isAuthorizedFoodAdmin(req)) {
      return res.status(403).json({ error: "Rol no autorizado para administrar productos" });
    }

    uploadProductImage.single('image')(req, res, (err) => {
      if (err instanceof multer.MulterError) {
        if (err.code === 'LIMIT_FILE_SIZE') return res.status(413).json({ error: "La imagen supera el límite de 5 MB" });
        return res.status(400).json({ error: "Error al procesar la imagen" });
      }
      if (err) return res.status(400).json({ error: "Formato de imagen no permitido. Use JPG, PNG o WebP." });

      const productId = String(req.body?.productId || '').trim();
      if (!productId || !req.file) {
        return res.status(400).json({ error: "productId e imagen son obligatorios" });
      }

      const product = db.getFoodProductById(productId);
      if (!product) return res.status(404).json({ error: "Producto no encontrado" });
      if (req.user!.role !== 'SUPER_ADMIN' && product.companyId !== req.user!.companyId) {
        return res.status(403).json({ error: "Acceso denegado al producto de otra empresa" });
      }

      const uploadDir = path.join(process.cwd(), 'data', 'uploads', 'companies', product.companyId, 'products', product.id);
      fs.mkdirSync(uploadDir, { recursive: true });
      const ext = { 'image/jpeg': '.jpg', 'image/png': '.png', 'image/webp': '.webp' }[req.file.mimetype] || '';
      const filename = `image_${crypto.randomUUID()}${ext}`;
      const targetPath = path.join(uploadDir, filename);
      fs.writeFileSync(targetPath, req.file.buffer, { flag: 'wx' });

      const imageUrl = `/uploads/companies/${encodeURIComponent(product.companyId)}/products/${encodeURIComponent(product.id)}/${encodeURIComponent(filename)}`;
      return res.json({ success: true, imageUrl });
    });
  });
'''
          pattern = r'  // UPLOAD PRODUCT IMAGE \(MULTI-TENANT SECURE FILE UPLOAD\)\n  app\.post\("/api/food/products/upload-image".*?(?=\n  // DELETE PRODUCT IMAGE)'
          s, n = re.subn(pattern, upload + '\n', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('upload route not found')

          delete = r'''  // DELETE PRODUCT IMAGE (MULTI-TENANT SECURE FILE DELETION)
  app.post("/api/food/products/delete-image", authenticateUser, (req: AuthenticatedRequest, res: Response) => {
    if (!isAuthorizedFoodAdmin(req)) {
      return res.status(403).json({ error: "Rol no autorizado para administrar productos" });
    }

    const { productId, imageUrl } = req.body || {};
    if (!productId || !imageUrl || typeof imageUrl !== 'string') {
      return res.status(400).json({ error: "productId e imageUrl son obligatorios" });
    }

    const product = db.getFoodProductById(String(productId));
    if (!product) return res.status(404).json({ error: "Producto no encontrado" });
    if (req.user!.role !== 'SUPER_ADMIN' && product.companyId !== req.user!.companyId) {
      return res.status(403).json({ error: "Acceso denegado al producto de otra empresa" });
    }

    const prefix = `/uploads/companies/${product.companyId}/products/${product.id}/`;
    if (!imageUrl.startsWith(prefix)) {
      return res.status(403).json({ error: "La imagen no pertenece al producto" });
    }

    const relativeName = imageUrl.slice(prefix.length);
    if (!relativeName || relativeName.includes('/') || relativeName.includes('\\') || relativeName.includes('..')) {
      return res.status(400).json({ error: "Ruta de imagen inválida" });
    }

    const productDir = path.resolve(process.cwd(), 'data', 'uploads', 'companies', product.companyId, 'products', product.id);
    const targetPath = path.resolve(productDir, relativeName);
    const relative = path.relative(productDir, targetPath);
    if (!relative || relative.startsWith('..') || path.isAbsolute(relative)) {
      return res.status(400).json({ error: "Ruta de imagen inválida" });
    }

    if (!fs.existsSync(targetPath)) return res.status(404).json({ error: "Imagen no encontrada" });
    fs.unlinkSync(targetPath);
    return res.json({ success: true });
  });
'''
          pattern = r'  // DELETE PRODUCT IMAGE \(MULTI-TENANT SECURE FILE DELETION\)\n  app\.post\("/api/food/products/delete-image".*?(?=\n  app\.)'
          s, n = re.subn(pattern, delete + '\n', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('delete route not found')

          p.write_text(s)

          p = Path('src/components/food/FoodMerchantPanel.tsx')
          s = p.read_text()
          s = s.replace("  const [localImageBase64, setLocalImageBase64] = useState<string | null>(null);\n", "")
          s = re.sub(r'''\n\s*const reader = new FileReader\(\);\n\s*reader\.onloadend = \(\) => \{\n\s*setLocalImageBase64\(reader\.result as string\);\n\s*\};\n\s*reader\.onerror = \(\) => \{\n\s*alert\("Error al leer el archivo\."\);\n\s*\};\n\s*reader\.readAsDataURL\(file\);''', '', s, count=1)
          old = r'''if (imageUploadMethod === 'upload') {
        if (localImageFile && localImageBase64) {
          // Upload local image to server first
          const uploadRes = await fetch('/api/food/products/upload-image', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
            },
            body: JSON.stringify({
              productId,
              imageBase64: localImageBase64,
            }),
          });'''
          new = r'''if (imageUploadMethod === 'upload') {
        if (localImageFile) {
          const formData = new FormData();
          formData.append('productId', productId);
          formData.append('image', localImageFile);
          const uploadRes = await fetch('/api/food/products/upload-image', {
            method: 'POST',
            headers: {
              ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
            },
            body: formData,
          });'''
          if old not in s: raise SystemExit('frontend upload block not found')
          s = s.replace(old,new,1)
          p.write_text(s)
          PY
          if git diff --quiet; then echo 'No changes produced'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts src/components/food/FoodMerchantPanel.tsx
          git commit -m 'fix: harden food image uploads and identifier generation'
          git push
      - name: Remove patch workflow
        if: success()
        run: |
          rm -f .github/workflows/apply_hito1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply_hito1.yml
          git commit -m 'chore: remove one-time hito 1 patch workflow'
          git push
