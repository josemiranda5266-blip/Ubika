name: Finalize UBIKA legal compliance
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[legal-finalize]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/legal-finalize.mjs
      - name: Commit final legal corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f LEGAL_FINALIZE_TRIGGER.md scripts/legal-finalize.mjs .github/workflows/legal-finalize.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: finalize Argentine legal compliance controls"
          git fetch origin main
          git rebase origin/main
          git push
