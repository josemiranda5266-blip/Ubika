name: Apply UBIKA Argentina Legal Compliance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compliance migration
        run: |
          if [ ! -f scripts/apply-legal-compliance-v3.mjs ]; then
            echo "Migration script not present; nothing to apply."
            exit 0
          fi
          node scripts/apply-legal-compliance-v3.mjs
      - name: Commit compliance changes and clean migration artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f LEGAL_MIGRATION_TRIGGER.md scripts/apply-legal-compliance.mjs scripts/apply-legal-compliance-v2.mjs scripts/apply-legal-compliance-v3.mjs
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: implement Argentine legal compliance controls"
          git push
