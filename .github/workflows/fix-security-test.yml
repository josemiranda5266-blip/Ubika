name: Fix security test fixture ordering

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[fix-security-fixture]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move fixture injection before JWT test data lookup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/security_and_flow.test.ts')
          s = p.read_text()
          old = "  const JWT_SECRET = process.env.JWT_SECRET!;\n  assert(!!JWT_SECRET && JWT_SECRET.length >= 16, 'JWT_SECRET está configurado desde variables de entorno');\n\n  const adminUserA = db.getUsersByCompany('comp_centro_logistico_01')[0];"
          new = "  const JWT_SECRET = process.env.JWT_SECRET!;\n  assert(!!JWT_SECRET && JWT_SECRET.length >= 16, 'JWT_SECRET está configurado desde variables de entorno');\n\n  // Los fixtures demo deben estar disponibles antes de generar tokens de prueba.\n  // Se mantiene la inyección explícita para no activar seeds demo en producción.\n  injectTestFixtures();\n\n  const adminUserA = db.getUsersByCompany('comp_centro_logistico_01')[0];"
          if old not in s:
              raise SystemExit('Target block not found; refusing unsafe patch')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove duplicate later fixture injection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/security_and_flow.test.ts')
          s = p.read_text()
          old = "  // ----------------------------------------------------\n  // CONFIGURACIÓN DE SERVIDOR HTTP PARA TESTS REALES\n  // ----------------------------------------------------\n  injectTestFixtures();\n  const app = createUbikaApp();"
          new = "  // ----------------------------------------------------\n  // CONFIGURACIÓN DE SERVIDOR HTTP PARA TESTS REALES\n  // ----------------------------------------------------\n  const app = createUbikaApp();"
          if old not in s:
              raise SystemExit('Second target block not found; refusing unsafe patch')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/security_and_flow.test.ts .github/workflows/fix-security-test.yml
          git commit -m 'fix: seed security test fixtures before token generation'
          git rm .github/workflows/fix-security-test.yml
          git commit -m 'chore: remove one-time security test patch workflow'
          git push
