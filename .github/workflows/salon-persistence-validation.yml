name: Salon Persistence Validation

on:
  push:
    branches:
      - feat/salon-tables-qr
  pull_request:
    branches:
      - feat/salon-tables-qr

jobs:
  validate-persistence:
    runs-on: ubuntu-latest
    env:
      INITIAL_ADMIN_PASSWORD: ci-test-password-123
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Persistent Salon test
        run: npx tsx server/salon/persistence.test.ts
