name: Apply UBIKA Argentina Legal Compliance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[legal-compliance]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply legal compliance migration
        run: node scripts/apply-legal-compliance-v3.mjs
      - name: Commit and clean migration artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f LEGAL_MIGRATION_TRIGGER.md scripts/apply-legal-compliance.mjs scripts/apply-legal-compliance-v2.mjs scripts/apply-legal-compliance-v3.mjs .github/workflows/apply-legal-compliance.yml .github/workflows/legal-compliance.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: implement Argentine legal compliance controls"
          git push
