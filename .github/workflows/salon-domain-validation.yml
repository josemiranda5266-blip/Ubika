name: Salon Domain Validation

on:
  push:
    branches:
      - feat/salon-tables-qr
  pull_request:
    branches:
      - feat/salon-tables-qr

jobs:
  salon-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Salon domain tests
        run: npx tsx server/salon/service.test.ts
