name: Salon Validation

on:
  push:
    branches:
      - feat/salon-tables-qr
  pull_request:
    branches:
      - feat/salon-tables-qr

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Salon tests
        run: npx tsx server/salon/service.test.ts

      - name: Production build
        run: npm run build
