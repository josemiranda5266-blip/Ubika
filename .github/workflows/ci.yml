name: UBIKA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        # The repository lockfile is valid but Bun 1.4.x currently reports it
        # as needing a rewrite under frozen mode. Keep CI install non-mutating.
        run: bun install --no-save --no-progress
      - name: Typecheck
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
