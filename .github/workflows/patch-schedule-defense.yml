name: Patch schedule defense
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          old = "const daySchedule = store!.schedule.find((s) => s.dayOfWeek === currentDay);"
          new = "const schedule = Array.isArray(store!.schedule) ? store!.schedule : [];\n    const daySchedule = schedule.find((s) => s.dayOfWeek === currentDay);"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'fix: guard food store schedule against legacy data'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/patch-schedule-defense.yml || true
          git commit -m 'chore: remove temporary schedule defense workflow' || true
          git push || true
