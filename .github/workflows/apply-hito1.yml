name: Apply UBIKA Hito 1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-hito1]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply critical sanitation patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          server_path = Path('server.ts')
          text = server_path.read_text()

          if 'import multer from "multer";' not in text:
              text = text.replace('import express, { Request, Response } from "express";\n', 'import express, { Request, Response } from "express";\nimport multer from "multer";\n', 1)

          text = text.replace('id: `ev_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`', 'id: `ev_${crypto.randomUUID()}`')
          text = text.replace('const companyId = `comp_${Date.now()}`;', 'const companyId = `comp_${crypto.randomUUID()}`;')
          text = text.replace('id: `usr_${Date.now()}`', 'id: `usr_${crypto.randomUUID()}`')
          text = text.replace('id: `inv_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`', 'id: `inv_${crypto.randomUUID()}`')
          text = text.replace('id: id || `fprod_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`', 'id: id || `fprod_${crypto.randomUUID()}`')

          marker = 'const uploadTempDir = path.join(process.cwd(), \'data\', \'uploads\', \'.tmp\');'
          if marker not in text:
              anchor = 'export function createUbikaApp(): express.Express {\n'
              storage = '''const uploadTempDir = path.join(process.cwd(), 'data', 'uploads', '.tmp');

const productImageStorage = multer.diskStorage({
  destination: (_req, _file, cb) => {
    fs.mkdirSync(uploadTempDir, { recursive: true });
    cb(null, uploadTempDir);
  },
  filename: (_req, file, cb) => {
    const ext = path.extname(file.originalname).toLowerCase();
    cb(null, `image_${crypto.randomUUID()}${ext}`);
  },
});

const uploadProductImage = multer({
  storage: productImageStorage,
  limits: { fileSize: 5 * 1024 * 1024 },
  fileFilter: (_req, file, cb) => {
    const allowedMime = new Set(['image/jpeg', 'image/png', 'image/webp']);
    const allowedExt = new Set(['.jpg', '.jpeg', '.png', '.webp']);
    const ext = path.extname(file.originalname).toLowerCase();
    if (!allowedMime.has(file.mimetype) || !allowedExt.has(ext)) {
      return cb(new Error('Formato de imagen no permitido. Use JPG, PNG o WEBP.'));
    }
    cb(null, true);
  },
});

'''
              if anchor not in text:
                  raise SystemExit('No se encontró el punto de inserción de Multer')
              text = text.replace(anchor, storage + anchor, 1)

          upload_pattern = re.compile(r'  // UPLOAD PRODUCT IMAGE \(MULTI-TENANT SECURE FILE UPLOAD\).*?(?=  // DELETE PRODUCT IMAGE \(MULTI-TENANT SECURE FILE DELETION\))', re.S)
          upload_replacement = '''  // UPLOAD PRODUCT IMAGE (MULTI-TENANT SECURE FILE UPLOAD)
  app.post("/api/food/products/upload-image", authenticateUser, (req: AuthenticatedRequest, res: Response, next) => {
    if (!isAuthorizedFoodAdmin(req)) {
      return res.status(403).json({ error: "Rol no autorizado para administrar productos" });
    }

    uploadProductImage.single('image')(req, res, (err) => {
      if (err) {
        if (req.file?.path) fs.unlink(req.file.path, () => undefined);
        if (err instanceof multer.MulterError && err.code === 'LIMIT_FILE_SIZE') {
          return res.status(413).json({ error: "La imagen supera el límite de 5 MB" });
        }
        return res.status(400).json({ error: err.message || "No se pudo procesar la imagen" });
      }

      const uploadedPath = req.file?.path;
      const productId = typeof req.body.productId === 'string' ? req.body.productId.trim() : '';
      const companyId = req.user!.companyId;

      if (!uploadedPath || !productId) {
        if (uploadedPath) fs.unlink(uploadedPath, () => undefined);
        return res.status(400).json({ error: "productId e imagen son obligatorios" });
      }

      const company = db.getCompanyById(companyId);
      const product = db.getFoodProductById(productId);
      if (!company || !isFoodAuthorizedCompany(company)) {
        fs.unlink(uploadedPath, () => undefined);
        return res.status(403).json({ error: "Comercio no autorizado para operar módulo gastronómico" });
      }
      if (!product || product.companyId !== companyId) {
        fs.unlink(uploadedPath, () => undefined);
        return res.status(404).json({ error: "Producto no encontrado o no pertenece a su empresa" });
      }

      const productDir = path.join(process.cwd(), 'data', 'uploads', 'companies', companyId, 'products', productId);
      fs.mkdirSync(productDir, { recursive: true });
      const filename = path.basename(uploadedPath);
      const finalPath = path.join(productDir, filename);

      try {
        fs.renameSync(uploadedPath, finalPath);
      } catch (moveError) {
        fs.unlink(uploadedPath, () => undefined);
        console.error('[UBIKA] Error moving uploaded image:', moveError);
        return res.status(500).json({ error: "No se pudo guardar la imagen" });
      }

      const imageUrl = `/uploads/companies/${encodeURIComponent(companyId)}/products/${encodeURIComponent(productId)}/${encodeURIComponent(filename)}`;
      db.updateFoodProduct(productId, { imageUrl, updatedAt: Date.now() });
      return res.status(201).json({ imageUrl });
    });
  });

'''
          if not upload_pattern.search(text):
              raise SystemExit('No se encontró el endpoint de upload existente')
          text = upload_pattern.sub(upload_replacement, text, count=1)

          delete_pattern = re.compile(r'  // DELETE PRODUCT IMAGE \(MULTI-TENANT SECURE FILE DELETION\).*?(?=\n  // )', re.S)
          delete_replacement = '''  // DELETE PRODUCT IMAGE (MULTI-TENANT SECURE FILE DELETION)
  app.post("/api/food/products/delete-image", authenticateUser, (req: AuthenticatedRequest, res: Response) => {
    if (!isAuthorizedFoodAdmin(req)) {
      return res.status(403).json({ error: "Rol no autorizado para administrar productos" });
    }

    const companyId = req.user!.companyId;
    const productId = typeof req.body.productId === 'string' ? req.body.productId.trim() : '';
    const imageUrl = typeof req.body.imageUrl === 'string' ? req.body.imageUrl.trim() : '';
    const company = db.getCompanyById(companyId);
    const product = productId ? db.getFoodProductById(productId) : undefined;

    if (!company || !isFoodAuthorizedCompany(company)) {
      return res.status(403).json({ error: "Comercio no autorizado para operar módulo gastronómico" });
    }
    if (!product || product.companyId !== companyId) {
      return res.status(404).json({ error: "Producto no encontrado o no pertenece a su empresa" });
    }
    if (!imageUrl.startsWith('/uploads/')) {
      return res.status(400).json({ error: "Ruta de imagen no válida" });
    }

    const uploadsRoot = path.resolve(process.cwd(), 'data', 'uploads');
    const productDir = path.resolve(uploadsRoot, 'companies', companyId, 'products', productId);
    let relativeImagePath: string;
    try {
      relativeImagePath = decodeURIComponent(imageUrl.slice('/uploads/'.length));
    } catch {
      return res.status(400).json({ error: "Ruta de imagen no válida" });
    }

    const targetPath = path.resolve(uploadsRoot, relativeImagePath);
    const relativeToProduct = path.relative(productDir, targetPath);
    if (!relativeToProduct || relativeToProduct === '..' || relativeToProduct.startsWith(`..${path.sep}`) || path.isAbsolute(relativeToProduct)) {
      return res.status(403).json({ error: "Acceso denegado a una imagen fuera del producto" });
    }

    try {
      if (fs.existsSync(targetPath)) fs.unlinkSync(targetPath);
      if (product.imageUrl === imageUrl) {
        db.updateFoodProduct(productId, { imageUrl: undefined, updatedAt: Date.now() });
      }
      return res.json({ success: true });
    } catch (deleteError) {
      console.error('[UBIKA] Error deleting product image:', deleteError);
      return res.status(500).json({ error: "No se pudo eliminar la imagen" });
    }
  });
'''
          if not delete_pattern.search(text):
              raise SystemExit('No se encontró el endpoint de delete existente')
          text = delete_pattern.sub(delete_replacement, text, count=1)

          server_path.write_text(text)

          # Legal consumer rights patch. Legacy accounts with no historical evidence are not
          # silently treated as consented; they must re-consent when the product supports it.
          server = Path('server.ts')
          text = server.read_text()
          text = text.replace("if (typeof user.privacyPolicyAccepted !== 'boolean') user.privacyPolicyAccepted = true;", "if (typeof user.privacyPolicyAccepted !== 'boolean') user.privacyPolicyAccepted = false;")
          text = text.replace("if (typeof user.privacyPolicyAcceptedAt !== 'number') user.privacyPolicyAcceptedAt = user.createdAt || now;", "if (typeof user.privacyPolicyAcceptedAt !== 'number') user.privacyPolicyAcceptedAt = 0;")
          text = text.replace("if (typeof user.termsOfServiceAccepted !== 'boolean') user.termsOfServiceAccepted = true;", "if (typeof user.termsOfServiceAccepted !== 'boolean') user.termsOfServiceAccepted = false;")
          text = text.replace("if (typeof user.termsOfServiceAcceptedAt !== 'number') user.termsOfServiceAcceptedAt = user.createdAt || now;", "if (typeof user.termsOfServiceAcceptedAt !== 'number') user.termsOfServiceAcceptedAt = 0;")
          text = text.replace("db.updateUser(user.id, { email: 'deleted_' + user.id + '@ubika.local', name: 'Usuario Eliminado', phone: undefined, active: false });", "db.updateUser(user.id, { email: 'deleted_' + user.id + '@ubika.local', name: 'Usuario Eliminado', phone: undefined, active: false, privacyPolicyAccepted: false, privacyPolicyAcceptedAt: 0, termsOfServiceAccepted: false, termsOfServiceAcceptedAt: 0 });")

          marker = '  app.get(\"/api/legal/company-compliance\", authenticateUser, (req: AuthenticatedRequest, res: Response) => {'
          if marker in text and 'app.post(\"/api/legal/withdrawal-request\"' not in text:
              block = '''  // Consumer digital withdrawal and complaint channels.
  app.post(\"/api/legal/withdrawal-request\", rateLimit(60000, 10), (req: Request, res: Response) => {
    const saleId = typeof req.body?.saleId === 'string' ? req.body.saleId.trim() : '';
    const email = typeof req.body?.email === 'string' ? req.body.email.trim().toLowerCase() : '';
    if (!saleId || !email) return res.status(400).json({ error: \"saleId y email son obligatorios\" });
    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) return res.status(400).json({ error: \"Correo electrónico inválido\" });
    const state: any = db.getRawState();
    if (!Array.isArray(state.legal_requests)) state.legal_requests = [];
    const requestId = `lr_${crypto.randomUUID()}`;
    state.legal_requests.unshift({ id: requestId, type: 'WITHDRAWAL', saleId, email, reason: typeof req.body?.reason === 'string' ? req.body.reason.trim().slice(0, 2000) : '', status: 'PENDING', createdAt: Date.now(), ipAddress: req.ip, userAgent: req.headers['user-agent'] });
    db.saveDatabaseSync();
    return res.status(200).json({ success: true, requestId, status: 'PENDING', message: \"Solicitud de arrepentimiento recibida.\" });
  });

  app.post(\"/api/legal/consumer-complaints\", rateLimit(60000, 10), (req: Request, res: Response) => {
    const name = typeof req.body?.name === 'string' ? req.body.name.trim().slice(0, 200) : '';
    const email = typeof req.body?.email === 'string' ? req.body.email.trim().toLowerCase() : '';
    const companyId = typeof req.body?.companyId === 'string' ? req.body.companyId.trim() : '';
    const description = typeof req.body?.description === 'string' ? req.body.description.trim().slice(0, 5000) : '';
    if (!name || !email || !companyId || !description) return res.status(400).json({ error: \"Datos incompletos\" });
    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) return res.status(400).json({ error: \"Correo electrónico inválido\" });
    if (!db.getCompanyById(companyId)) return res.status(404).json({ error: \"Empresa no encontrada\" });
    const state: any = db.getRawState();
    if (!Array.isArray(state.legal_requests)) state.legal_requests = [];
    const requestId = `lr_${crypto.randomUUID()}`;
    state.legal_requests.unshift({ id: requestId, type: 'CONSUMER_COMPLAINT', name, email, companyId, orderReference: typeof req.body?.orderReference === 'string' ? req.body.orderReference.trim().slice(0, 100) : '', description, status: 'OPEN', createdAt: Date.now(), ipAddress: req.ip, userAgent: req.headers['user-agent'] });
    db.saveDatabaseSync();
    return res.status(200).json({ success: true, requestId, message: \"Reclamo recibido y registrado.\" });
  });

  app.post(\"/api/legal/data-rectification\", authenticateUser, rateLimit(60000, 10), (req: AuthenticatedRequest, res: Response) => {
    const user = db.getUserById(req.user!.userId);
    if (!user) return res.status(404).json({ error: \"Usuario no encontrado\" });
    const updates: any = {};
    if (typeof req.body?.name === 'string') updates.name = req.body.name.trim().slice(0, 200);
    if (typeof req.body?.phone === 'string') updates.phone = req.body.phone.trim().slice(0, 50);
    if (typeof req.body?.email === 'string') updates.email = req.body.email.trim().toLowerCase();
    if (updates.email && !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(updates.email)) return res.status(400).json({ error: \"Correo electrónico inválido\" });
    if (updates.email && updates.email !== user.email && db.getUserByEmail(updates.email)) return res.status(409).json({ error: \"El correo electrónico ya está registrado\" });
    if (!Object.keys(updates).length) return res.status(400).json({ error: \"No se recibieron datos para rectificar\" });
    const updated = db.updateUser(user.id, updates);
    return res.status(200).json({ success: true, user: updated });
  });

'''
              text=text.replace(marker, block+marker, 1)
          server.write_text(text)

          # Add a typed legal request model for frontend/domain consumers.
          types = Path('src/types.ts')
          t = types.read_text()
          if 'export interface LegalRequest {' not in t:
              t += '''\n\nexport type LegalRequestType = 'WITHDRAWAL' | 'CONSUMER_COMPLAINT' | 'DATA_RECTIFICATION' | 'DATA_ACCESS' | 'DATA_SUPPRESSION';\nexport interface LegalRequest {\n  id: string;\n  type: LegalRequestType;\n  status: 'PENDING' | 'OPEN' | 'COMPLETED' | 'REJECTED';\n  createdAt: number;\n  companyId?: string;\n  userId?: string;\n  saleId?: string;\n  email?: string;\n  name?: string;\n  orderReference?: string;\n  description?: string;\n  reason?: string;\n  fields?: string[];\n}\n'''
              types.write_text(t)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/components/food/FoodMerchantPanel.tsx src/types.ts
          git commit -m "fix: complete consumer legal rights controls" || true
          git push
