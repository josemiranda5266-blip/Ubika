name: Apply UBIKA Consumer Rights v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch legal layer
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('server.ts')
          s = p.read_text()
          s = s.replace("if (typeof user.privacyPolicyAccepted !== 'boolean') user.privacyPolicyAccepted = true;", "if (typeof user.privacyPolicyAccepted !== 'boolean') user.privacyPolicyAccepted = false;")
          s = s.replace("if (typeof user.privacyPolicyAcceptedAt !== 'number') user.privacyPolicyAcceptedAt = user.createdAt || now;", "if (typeof user.privacyPolicyAcceptedAt !== 'number') user.privacyPolicyAcceptedAt = 0;")
          s = s.replace("if (typeof user.termsOfServiceAccepted !== 'boolean') user.termsOfServiceAccepted = true;", "if (typeof user.termsOfServiceAccepted !== 'boolean') user.termsOfServiceAccepted = false;")
          s = s.replace("if (typeof user.termsOfServiceAcceptedAt !== 'number') user.termsOfServiceAcceptedAt = user.createdAt || now;", "if (typeof user.termsOfServiceAcceptedAt !== 'number') user.termsOfServiceAcceptedAt = 0;")
          s = s.replace("db.updateUser(user.id, { email: 'deleted_' + user.id + '@ubika.local', name: 'Usuario Eliminado', phone: undefined, active: false });", "db.updateUser(user.id, { email: 'deleted_' + user.id + '@ubika.local', name: 'Usuario Eliminado', phone: undefined, active: false, privacyPolicyAccepted: false, privacyPolicyAcceptedAt: 0, termsOfServiceAccepted: false, termsOfServiceAcceptedAt: 0 });")

          marker = '  app.get("/api/legal/company-compliance", authenticateUser, (req: AuthenticatedRequest, res: Response) => {'
          if 'app.post("/api/legal/withdrawal-request"' not in s:
              if marker not in s: raise SystemExit('legal marker missing')
              block = r'''  // Consumer digital withdrawal / complaint channels. No login is required for the withdrawal button.
  app.post("/api/legal/withdrawal-request", rateLimit(60000, 10), (req: Request, res: Response) => {
    const saleId = typeof req.body?.saleId === 'string' ? req.body.saleId.trim() : '';
    const email = typeof req.body?.email === 'string' ? req.body.email.trim().toLowerCase() : '';
    const reason = typeof req.body?.reason === 'string' ? req.body.reason.trim().slice(0, 2000) : '';
    if (!saleId || !email) return res.status(400).json({ error: "saleId y email son obligatorios" });
    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) return res.status(400).json({ error: "Correo electrónico inválido" });
    const state: any = db.getRawState();
    if (!Array.isArray(state.legal_requests)) state.legal_requests = [];
    const requestId = `lr_${crypto.randomUUID()}`;
    state.legal_requests.unshift({ id: requestId, type: 'WITHDRAWAL', saleId, email, reason, status: 'PENDING', createdAt: Date.now(), ipAddress: req.ip, userAgent: req.headers['user-agent'] });
    db.saveDatabaseSync();
    return res.status(200).json({ success: true, requestId, status: 'PENDING', message: "Solicitud de arrepentimiento recibida." });
  });

  app.post("/api/legal/consumer-complaints", rateLimit(60000, 10), (req: Request, res: Response) => {
    const name = typeof req.body?.name === 'string' ? req.body.name.trim().slice(0, 200) : '';
    const email = typeof req.body?.email === 'string' ? req.body.email.trim().toLowerCase() : '';
    const companyId = typeof req.body?.companyId === 'string' ? req.body.companyId.trim() : '';
    const orderReference = typeof req.body?.orderReference === 'string' ? req.body.orderReference.trim().slice(0, 100) : '';
    const description = typeof req.body?.description === 'string' ? req.body.description.trim().slice(0, 5000) : '';
    if (!name || !email || !companyId || !description) return res.status(400).json({ error: "name, email, companyId y description son obligatorios" });
    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) return res.status(400).json({ error: "Correo electrónico inválido" });
    if (!db.getCompanyById(companyId)) return res.status(404).json({ error: "Empresa no encontrada" });
    const state: any = db.getRawState();
    if (!Array.isArray(state.legal_requests)) state.legal_requests = [];
    const requestId = `lr_${crypto.randomUUID()}`;
    state.legal_requests.unshift({ id: requestId, type: 'CONSUMER_COMPLAINT', name, email, companyId, orderReference, description, status: 'OPEN', createdAt: Date.now(), ipAddress: req.ip, userAgent: req.headers['user-agent'] });
    db.saveDatabaseSync();
    return res.status(200).json({ success: true, requestId, message: "Reclamo recibido y registrado." });
  });

  app.post("/api/legal/data-rectification", authenticateUser, rateLimit(60000, 10), (req: AuthenticatedRequest, res: Response) => {
    const user = db.getUserById(req.user!.userId);
    if (!user) return res.status(404).json({ error: "Usuario no encontrado" });
    const name = typeof req.body?.name === 'string' ? req.body.name.trim().slice(0, 200) : undefined;
    const phone = typeof req.body?.phone === 'string' ? req.body.phone.trim().slice(0, 50) : undefined;
    const email = typeof req.body?.email === 'string' ? req.body.email.trim().toLowerCase() : undefined;
    if (email !== undefined && !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) return res.status(400).json({ error: "Correo electrónico inválido" });
    if (email && email !== user.email && db.getUserByEmail(email)) return res.status(409).json({ error: "El correo electrónico ya está registrado" });
    const updates: any = {};
    if (name !== undefined) updates.name = name;
    if (phone !== undefined) updates.phone = phone;
    if (email !== undefined) updates.email = email;
    if (!Object.keys(updates).length) return res.status(400).json({ error: "No se recibieron datos para rectificar" });
    const updated = db.updateUser(user.id, updates);
    const state: any = db.getRawState();
    if (!Array.isArray(state.legal_requests)) state.legal_requests = [];
    state.legal_requests.unshift({ id: `lr_${crypto.randomUUID()}`, type: 'DATA_RECTIFICATION', userId: user.id, companyId: user.companyId, fields: Object.keys(updates), status: 'COMPLETED', createdAt: Date.now(), ipAddress: req.ip, userAgent: req.headers['user-agent'] });
    db.saveDatabaseSync();
    return res.status(200).json({ success: true, user: updated });
  });

'''
              s = s.replace(marker, block + marker, 1)
          p.write_text(s)

          tpath = Path('src/types.ts')
          t = tpath.read_text()
          if 'export interface LegalRequest {' not in t:
              t += '''\n\nexport type LegalRequestType = 'WITHDRAWAL' | 'CONSUMER_COMPLAINT' | 'DATA_RECTIFICATION' | 'DATA_ACCESS' | 'DATA_SUPPRESSION';\nexport interface LegalRequest {\n  id: string;\n  type: LegalRequestType;\n  status: 'PENDING' | 'OPEN' | 'COMPLETED' | 'REJECTED';\n  createdAt: number;\n  companyId?: string;\n  userId?: string;\n  saleId?: string;\n  email?: string;\n  name?: string;\n  orderReference?: string;\n  description?: string;\n  reason?: string;\n  fields?: string[];\n}\n'''
              tpath.write_text(t)

          rpath = Path('README.md')
          r = rpath.read_text()
          if '## ⚖️ Cumplimiento Legal Argentino' not in r:
              rpath.write_text(r.rstrip() + '''\n\n## ⚖️ Cumplimiento Legal Argentino\n\nUBIKA incorpora controles técnicos para protección de datos y defensa del consumidor: consentimiento trazable, acceso/rectificación/supresión, desactivación y anonimización, canal digital de arrepentimiento, recepción de reclamos, trazabilidad de IP/User-Agent y datos fiscales CAE/fecha de vencimiento. Estos controles no sustituyen la revisión jurídica, las obligaciones específicas del comercio ni la configuración jurisdiccional correspondiente.\n''')

          Path('.github/workflows/apply-legal-next2.yml').unlink(missing_ok=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/types.ts README.md .github/workflows/apply-legal-next2.yml
          git commit -m "fix: implement consumer digital rights and legal traceability"
          git push
