name: UBIKA Hito 1 Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply safe ID and image upload hardening
        env:
          GH_ACTOR: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text()
          def write(p, s): Path(p).write_text(s)

          # Commerce IDs: replace timestamp/random IDs with UUIDs while preserving prefixes.
          p = 'server/commerce/service.ts'
          s = read(p)
          if "import crypto from 'node:crypto';" not in s:
              s = "import crypto from 'node:crypto';\n" + s
          if 'function generateEntityId(prefix: string)' not in s:
              marker = "const lockContext = new AsyncLocalStorage<Set<string>>();"
              s = s.replace(marker, marker + "\n\nfunction generateEntityId(prefix: string): string {\n  return `${prefix}_${crypto.randomUUID()}`;\n}")
          s = re.sub(r"`cat_\$\{Date\.now\(\)\}_\$\{Math\.random\(\)\.toString\(36\)\.substring\(2, 7\)\}`", "generateEntityId('cat')", s)
          s = re.sub(r"`prod_\$\{Date\.now\(\)\}_\$\{Math\.random\(\)\.toString\(36\)\.substring\(2, 7\)\}`", "generateEntityId('prod')", s)
          s = re.sub(r"`cust_\$\{Date\.now\(\)\}_\$\{Math\.random\(\)\.toString\(36\)\.substring\(2, 7\)\}`", "generateEntityId('cust')", s)
          s = re.sub(r"`mov_\$\{Date\.now\(\)\}_\$\{Math\.random\(\)\.toString\(36\)\.substring\(2, 7\)\}`", "generateEntityId('mov')", s)
          s = re.sub(r"`cash_\$\{Date\.now\(\)\}_\$\{Math\.random\(\)\.toString\(36\)\.substring\(2, 7\)\}`", "generateEntityId('cash')", s)
          write(p, s)

          # Server IDs and secure multipart upload/delete.
          p = 'server.ts'
          s = read(p)
          if "import multer from 'multer';" not in s:
              s = s.replace("import crypto from \"crypto\";", "import crypto from \"crypto\";\nimport multer from 'multer';")
          if 'const productImageUpload = multer(' not in s:
              anchor = "const app = express();"
              cfg = """
const productImageUpload = multer({
  storage: multer.memoryStorage(),
  limits: { fileSize: 5 * 1024 * 1024, files: 1 },
  fileFilter: (_req, file, cb) => {
    const allowed = new Set(['image/jpeg', 'image/png', 'image/webp']);
    if (!allowed.has(file.mimetype)) return cb(new Error('UNSUPPORTED_IMAGE_TYPE'));
    cb(null, true);
  },
});
"""
              if anchor not in s: raise SystemExit('server.ts: app anchor not found')
              s = s.replace(anchor, anchor + '\n' + cfg, 1)

          # Secure ID replacements in server.ts.
          replacements = {
            "`ev_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`": "`ev_${crypto.randomUUID()}`",
            "`comp_${Date.now()}`": "`comp_${crypto.randomUUID()}`",
            "`usr_${Date.now()}`": "`usr_${crypto.randomUUID()}`",
            "`inv_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`": "`inv_${crypto.randomUUID()}`",
          }
          for a,b in replacements.items(): s = s.replace(a,b)

          upload_pattern = re.compile(r'  // UPLOAD PRODUCT IMAGE \(MULTI-TENANT SECURE FILE UPLOAD\).*?(?=  // DELETE PRODUCT IMAGE \(MULTI-TENANT SECURE FILE DELETION\))', re.S)
          upload_replacement = '''  // UPLOAD PRODUCT IMAGE (MULTI-TENANT SECURE FILE UPLOAD)
  app.post("/api/food/products/upload-image", authenticateUser, productImageUpload.single('image'), (req: AuthenticatedRequest, res: Response) => {
    if (!isAuthorizedFoodAdmin(req)) {
      return res.status(403).json({ error: "Rol no autorizado para administrar productos" });
    }
    const productId = typeof req.body.productId === 'string' ? req.body.productId.trim() : '';
    if (!productId) return res.status(400).json({ error: 'productId es requerido' });
    const companyId = req.user!.companyId;
    const product = db.getFoodProductById(productId);
    if (!product || product.companyId !== companyId) {
      return res.status(404).json({ error: 'Producto no encontrado' });
    }
    if (!req.file) return res.status(400).json({ error: 'Imagen requerida' });

    const extensionByMime: Record<string, string> = {
      'image/jpeg': '.jpg',
      'image/png': '.png',
      'image/webp': '.webp',
    };
    const extension = extensionByMime[req.file.mimetype];
    if (!extension) return res.status(400).json({ error: 'Tipo de imagen no permitido' });

    const filename = `${crypto.randomUUID()}${extension}`;
    const companyDir = path.join(process.cwd(), 'data', 'uploads', 'companies', companyId, 'products', productId);
    fs.mkdirSync(companyDir, { recursive: true });
    const filePath = path.join(companyDir, filename);
    fs.writeFileSync(filePath, req.file.buffer, { flag: 'wx' });

    const imageUrl = `/uploads/companies/${encodeURIComponent(companyId)}/products/${encodeURIComponent(productId)}/${encodeURIComponent(filename)}`;
    db.updateFoodProduct(productId, { imageUrl, updatedAt: Date.now() });
    return res.status(201).json({ imageUrl });
  });

'''
          if not upload_pattern.search(s): raise SystemExit('server.ts: upload marker not found')
          s = upload_pattern.sub(upload_replacement, s, count=1)

          delete_pattern = re.compile(r'  // DELETE PRODUCT IMAGE \(MULTI-TENANT SECURE FILE DELETION\).*?(?=\n  // )', re.S)
          delete_replacement = '''  // DELETE PRODUCT IMAGE (MULTI-TENANT SECURE FILE DELETION)
  app.post("/api/food/products/delete-image", authenticateUser, (req: AuthenticatedRequest, res: Response) => {
    if (!isAuthorizedFoodAdmin(req)) {
      return res.status(403).json({ error: "Rol no autorizado para administrar productos" });
    }
    const productId = typeof req.body.productId === 'string' ? req.body.productId.trim() : '';
    if (!productId) return res.status(400).json({ error: 'productId es requerido' });
    const companyId = req.user!.companyId;
    const product = db.getFoodProductById(productId);
    if (!product || product.companyId !== companyId) {
      return res.status(404).json({ error: 'Producto no encontrado' });
    }
    const imageUrl = typeof product.imageUrl === 'string' ? product.imageUrl : '';
    const prefix = `/uploads/companies/${encodeURIComponent(companyId)}/products/${encodeURIComponent(productId)}/`;
    if (!imageUrl.startsWith(prefix)) return res.status(400).json({ error: 'Imagen inválida' });
    const filename = decodeURIComponent(imageUrl.slice(prefix.length));
    if (!filename || filename.includes('/') || filename.includes('\\\\')) {
      return res.status(400).json({ error: 'Nombre de archivo inválido' });
    }
    const uploadRoot = path.resolve(process.cwd(), 'data', 'uploads');
    const targetPath = path.resolve(uploadRoot, 'companies', companyId, 'products', productId, filename);
    const relative = path.relative(uploadRoot, targetPath);
    if (relative.startsWith('..') || path.isAbsolute(relative)) {
      return res.status(400).json({ error: 'Ruta de archivo inválida' });
    }
    if (fs.existsSync(targetPath)) fs.unlinkSync(targetPath);
    db.updateFoodProduct(productId, { imageUrl: '', updatedAt: Date.now() });
    return res.json({ success: true });
  });
'''
          if not delete_pattern.search(s): raise SystemExit('server.ts: delete marker not found')
          s = delete_pattern.sub(delete_replacement, s, count=1)
          write(p, s)

          # Food merchant: no Base64; send multipart FormData.
          p = 'src/components/food/FoodMerchantPanel.tsx'
          s = read(p)
          s = s.replace("  const [localImageBase64, setLocalImageBase64] = useState<string | null>(null);\n", '')
          s = re.sub(r"\n    // Read file as Base64\n    const reader = new FileReader\(\);\n    reader\.onloadend = \(\) => \{\n      setLocalImageBase64\(reader\.result as string\);\n    \};\n    reader\.onerror = \(\) => \{\n      setUploadError\('No se pudo leer la imagen'\);\n    \};\n    reader\.readAsDataURL\(file\);", '', s, count=1)
          s = s.replace('if (localImageFile && localImageBase64) {', 'if (localImageFile) {')
          old = re.compile(r"const uploadRes = await fetch\('/api/food/products/upload-image', \{.*?\n          \}\);", re.S)
          new = """const formData = new FormData();
          formData.append('productId', String(productId));
          formData.append('image', localImageFile);
          const uploadRes = await fetch('/api/food/products/upload-image', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
            body: formData,
          });"""
          s, n = old.subn(new, s, count=1)
          if n == 0: raise SystemExit('FoodMerchantPanel: upload fetch block not found')
          s = re.sub(r"`fprod_\$\{Date\.now\(\)\}_\$\{Math\.random\(\)\.toString\(36\)\.substr\(2, 4\)\}`", "`fprod_${crypto.randomUUID()}`", s)
          write(p, s)

          # POS idempotency key.
          p = 'src/components/commerce/POSView.tsx'
          s = read(p)
          s = re.sub(r"`pos_\$\{Date\.now\(\)\}_\$\{Math\.random\(\)\.toString\(36\).*?\}`", "`pos_${crypto.randomUUID()}`", s, count=1)
          write(p, s)
          PY

      - name: Commit hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts server/commerce/service.ts src/components/food/FoodMerchantPanel.tsx src/components/commerce/POSView.tsx
          if git diff --cached --quiet; then
            echo "No hardening changes needed"
            exit 0
          fi
          git commit -m "fix: harden uploads and generated identifiers"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/hito1-hardening.yml || true
          git commit -m "chore: remove one-time hito 1 workflow" || true
          git push || true
