name: UBIKA Phase 1 perimeter patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[phase1-perimeter]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply perimeter hardening only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('server.ts')
          s = p.read_text()

          old = "  app.set('trust proxy', 1); // Confía en el primer proxy para obtener la IP real del cliente"
          new = """  // Trust proxy only when explicitly configured. Blindly trusting the first hop
  // allows clients to spoof req.ip and bypass IP-based rate limits/auditing.
  const trustedProxyHops = Number.parseInt(process.env.TRUST_PROXY_HOPS || '0', 10);
  if (Number.isInteger(trustedProxyHops) && trustedProxyHops > 0) {
    app.set('trust proxy', trustedProxyHops);
  } else {
    app.set('trust proxy', false);
  }"""
          if old not in s:
              raise SystemExit('trust proxy marker not found')
          s = s.replace(old, new, 1)

          old_cors = """    res.setHeader('Access-Control-Allow-Origin', '*');
    res.setHeader('Access-Control-Allow-Methods', 'GET, POST, PATCH, PUT, DELETE, OPTIONS');
    res.setHeader('Access-Control-Allow-Headers', 'Content-Type, Authorization');"""
          new_cors = """    const configuredOrigins = (process.env.CORS_ALLOWED_ORIGINS || '')
      .split(',')
      .map(origin => origin.trim())
      .filter(Boolean);
    const requestOrigin = req.headers.origin;
    if (requestOrigin && configuredOrigins.includes(requestOrigin)) {
      res.setHeader('Access-Control-Allow-Origin', requestOrigin);
      res.setHeader('Vary', 'Origin');
    }
    res.setHeader('Access-Control-Allow-Methods', 'GET, POST, PATCH, PUT, DELETE, OPTIONS');
    res.setHeader('Access-Control-Allow-Headers', 'Content-Type, Authorization');"""
          if old_cors not in s:
              raise SystemExit('CORS marker not found')
          s = s.replace(old_cors, new_cors, 1)

          old_csp = """      \"default-src 'self' 'unsafe-inline' https: http: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: http:; style-src 'self' 'unsafe-inline' https: http:; img-src 'self' data: blob: https: http:; font-src 'self' data: https: http:; connect-src 'self' https: http: ws: wss:; frame-ancestors *;\""""
          new_csp = """      \"default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; form-action 'self';\""""
          if old_csp not in s:
              raise SystemExit('CSP marker not found')
          s = s.replace(old_csp, new_csp, 1)

          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix: harden API perimeter and proxy trust"
          git rm .github/workflows/phase1-perimeter-patch.yml
          git commit -m "chore: remove one-time perimeter patch workflow"
          git push
